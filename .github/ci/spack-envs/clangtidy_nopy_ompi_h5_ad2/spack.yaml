# This is a Spack environment file.
#
# Activating and installing this environment will provide all dependencies
# that are needed for full-feature development.
#   https//spack.readthedocs.io/en/latest/environments.html#anonymous-environments
#
spack:
  specs:
  - adios2@2.10
  - hdf5
  - openmpi
  - py-h5py

  packages:
    adios2:
      variants: ~zfp ~sz ~png ~dataman ~python ~fortran ~ssc ~shared ~bzip2 ~mgard

    c-blosc2:
      # snappy broken on CMake 4.0
      # fixed snappy not yet deployed to a Spack release
      variants: ~snappy

    cmake:
      externals:
      - spec: cmake@3.31.8
        prefix: /usr/local
      buildable: False

    openmpi:
      externals:
      - spec: openmpi@4.1.6
        prefix: /usr
      buildable: False

    perl:
      externals:
      - spec: perl@5.38.2
        prefix: /usr
      buildable: False

    python:
      externals:
      - spec: python@3.12.3
        prefix: /usr
      buildable: False

    all:
      target: [x86_64]
      variants: ~fortran
      providers:
        mpi: [openmpi]
        c: [llvm]
        cxx: [llvm]
        fortran: [gcc]
        gcc-runtime: [gcc-runtime@13.3.0]
      prefer:
      - "%llvm"

    llvm:
      externals:
      - spec: llvm@19.1.1 target=x86_64
        prefix: /
        paths:
          cc: /usr/bin/clang-19
          cxx: /usr/bin/clang++-19
        modules: []
        environment: {}
        extra_rpaths: []
      buildable: False

    gcc:
      externals:
      - spec: gcc@13.3.0
        prefix: /
        paths:
          f77: /usr/bin/gfortran
          fc: /usr/bin/gfortran
        modules: []
        environment: {}
        extra_rpaths: []
      buildable: False

    gcc-runtime:
      externals:
      - spec: gcc-runtime@13.3.0
        prefix: /usr
      buildable: False

  compilers:
  - compiler:
      spec: gcc@13.3.0
      environment: {}
      extra_rpaths: []
      flags: {}
      modules: []
      paths:
        cc: /usr/bin/gcc-13
        cxx: /usr/bin/g++-13
        f77: /usr/bin/gfortran-13
        fc: /usr/bin/gfortran-13
      operating_system: ubuntu24.04
      target: x86_64
  - compiler:
      spec: clang@19.1.1
      environment: {}
      extra_rpaths: []
      flags: {}
      modules: []
      paths:
        cc: /usr/bin/clang-19
        cxx: /usr/bin/clang++-19
        f77: /usr/bin/gfortran-13
        fc: /usr/bin/gfortran-13
      operating_system: ubuntu24.04
      target: x86_64

  config:
    build_jobs: 2

  mirrors:
    E4S: https://cache.e4s.io
