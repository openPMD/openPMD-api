language: python
python:
  - "3.11"

branches:
  only:
  - wheels

env:
  global:
    - OPENPMD_GIT_REF="0.17.1"

    - CIBW_PROJECT_REQUIRES_PYTHON=">=3.10"
    # Install dependencies on Linux and OSX
    - CIBW_BEFORE_BUILD="bash -x .github/library_builders.sh"
    # for the openPMD-api build, CMake shall search for
    # static dependencies of HDF5 and ADIOS2 (see setup.py)
    - CIBW_ENVIRONMENT="HDF5_USE_STATIC_LIBRARIES='ON' ZLIB_USE_STATIC_LIBS='ON' ADIOS_USE_STATIC_LIBS='ON' openPMD_CMAKE_openPMD_USE_HDF5='ON' openPMD_CMAKE_openPMD_USE_ADIOS2='ON'"
    # Show a bit more output (pip -v)
    - CIBW_BUILD_VERBOSITY="1"
    # Runtime smoke test (aarch64/ppc64le run natively on Travis hardware)
    - CIBW_TEST_REQUIRES="numpy"
    - CIBW_TEST_COMMAND="python {project}/.github/check_wheel_libs.py && python -c \"import openpmd_api as io; v=io.variants; assert v['hdf5'] and v['adios2'] and v['json'], v; print(io.__version__, dict(v))\" && python {project}/.github/smoke_roundtrip.py"

jobs:
  include:
    # perform a linux ARMv8 build
    # note: takes >50min, so we need to split
    # +manylinux
    - services: docker
      arch: arm64
      dist: focal
      env:
        - CIBW_BUILD="cp310-manylinux_aarch64 cp311-manylinux_aarch64"
    - services: docker
      arch: arm64
      dist: focal
      env:
        - CIBW_BUILD="cp312-manylinux_aarch64 cp313-manylinux_aarch64"
    - services: docker
      arch: arm64
      dist: focal
      env:
        - CIBW_BUILD="cp314-manylinux_aarch64"
    - services: docker
      arch: arm64
      dist: focal
      env:
        - CIBW_BUILD="pp310-manylinux_aarch64"
    # +musllinux
    - services: docker
      arch: arm64
      dist: focal
      env:
        - CIBW_BUILD="cp310-musllinux_aarch64 cp311-musllinux_aarch64"
    - services: docker
      arch: arm64
      dist: focal
      env:
        - CIBW_BUILD="cp312-musllinux_aarch64 cp313-musllinux_aarch64"
    - services: docker
      arch: arm64
      dist: focal
      env:
        - CIBW_BUILD="cp314-musllinux_aarch64"

    # perform a linux PPC64LE build
    - services: docker
      arch: ppc64le
      dist: focal
      env:
        - CIBW_BUILD="cp310-manylinux_ppc64le"
    - services: docker
      arch: ppc64le
      dist: focal
      env:
        - CIBW_BUILD="cp311-manylinux_ppc64le"
    - services: docker
      arch: ppc64le
      dist: focal
      env:
        - CIBW_BUILD="cp312-manylinux_ppc64le"
    - services: docker
      arch: ppc64le
      dist: focal
      env:
        - CIBW_BUILD="cp313-manylinux_ppc64le"
    - services: docker
      arch: ppc64le
      dist: focal
      env:
        - CIBW_BUILD="cp314-manylinux_ppc64le"
    - services: docker
      arch: ppc64le
      dist: focal
      env:
        - CIBW_BUILD="cp310-musllinux_ppc64le"
    - services: docker
      arch: ppc64le
      dist: focal
      env:
        - CIBW_BUILD="cp311-musllinux_ppc64le"
    - services: docker
      arch: ppc64le
      dist: focal
      env:
        - CIBW_BUILD="cp312-musllinux_ppc64le"
    - services: docker
      arch: ppc64le
      dist: focal
      env:
        - CIBW_BUILD="cp313-musllinux_ppc64le"
    - services: docker
      arch: ppc64le
      dist: focal
      env:
        - CIBW_BUILD="cp314-musllinux_ppc64le"

    # perform a linux S390X build
    # blocked by https://github.com/GTkorvo/dill/issues/15
    #- services: docker
    #  arch: s390x
    #  dist: focal
    #  env:
    #    - CIBW_BUILD="*_s390x"

    # and a build for old macOS versions (10.13 with xcode9.4.1 ~2017)
    # - os: osx
    #   osx_image: xcode9.4
    #   language: shell
    #   python: 3.6

install:
  - git clone --branch ${OPENPMD_GIT_REF} --depth 1 https://github.com/openPMD/openPMD-api.git src
  - cp library_builders.sh list_library_deps.py check_wheel_libs.py smoke_roundtrip.py src/.github/
  # Wheels-only re-release: bump the package version (same source).
  - (cd src && git apply ../setup-py-version-post2.patch)
  - python -m pip install --upgrade pip setuptools wheel
  - python -m pip install cibuildwheel==3.2.1
  # twine & cryptography: see
  #   https://github.com/scikit-build/cmake-python-distributions/blob/4730aeee240917303f293dffc89a8d8d5a4787c4/requirements-deploy.txt
  #   https://github.com/pyca/cryptography/issues/6086
  - python -m pip install twine cryptography~=3.3.2
  - python -m pip install patch

# Download & Apply Patches
#before_script:
#  - mkdir -p src/.patch
#  - cd src/.patch
#  - curl -sOL https://github.com/openPMD/openPMD-api/pull/1680.patch
#  - cd ..
#  - ls -hal .patch/
#  - git apply --exclude=.github/workflows/windows.yml .patch/1680.patch
#  - cd ..

script:
  - cd src
  - travis_wait 45 python -m cibuildwheel --output-dir ../wheelhouse
  - cd ..

deploy:
  - provider: script
    script: python -m twine upload --skip-existing wheelhouse/*
    skip_cleanup: true
    on:
      repo: ${TRAVIS_REPO_SLUG}
      branch: wheels
