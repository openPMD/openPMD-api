[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "cmake>=3.22.0",
    "packaging>=23",
    "pybind11>=2.13.0,<3.0.0"
]
build-backend = "setuptools.build_meta"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["openpmd_api", "openpmd_api_cxx"]
