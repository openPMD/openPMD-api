name: wheels

on: [push, pull_request]

env:
  SRC_REF: '0.17.1'
  # Patches applied to the published sdist. Version bump only: the .post1 sdist
  # is simply the released 0.17.1 source re-versioned (the binary-packaging
  # patches only matter for the wheels). Must match the wheels' version.
  SDIST_PATCHES: '.github/setup-py-version-post1.patch'

jobs:
  build_wheels:
    name: Build ${{ matrix.arch }} wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Per-entry knobs (all optional, sensible native defaults below):
        #   host_python  cibuildwheel host interpreter (default 3.11)
        #   platform     CIBW_PLATFORM                 (default auto)
        #   build        CIBW_BUILD                    (default *, i.e. all)
        #   patches      space-separated setup patches (default: Windows one)
        include:
          - os: ubuntu-22.04
            arch: "x86_64"

          - os: ubuntu-22.04
            arch: "i686"

          # builds faster on Travis-CI:
          #- os: ubuntu-20.04
          #  arch: "aarch64"

          # builds faster on Travis-CI:
          #- os: ubuntu-20.04
          #  arch: "ppc64le"

          # builds faster on Travis-CI:
          # blocked by https://github.com/GTkorvo/dill/issues/15
          #- os: ubuntu-20.04
          #  arch: "s390x"

          # x86-64 (64bit)
          - os: windows-2022
            arch: "AMD64"

          # x86 (32bit)
          - os: windows-2022
            arch: "x86"
            env:
              CMAKE_GENERATOR: "Visual Studio 17 2022"
              CMAKE_GENERATOR_PLATFORM: "Win32"

          - os: macos-15-intel
            arch: "x86_64"
            env:
              MACOSX_DEPLOYMENT_TARGET: 15.0

          # Apple Silicon M1/arm64/aarch64 builds:
          #   https://cibuildwheel.readthedocs.io/en/stable/faq/#apple-silicon
          #   https://github.com/pypa/cibuildwheel/pull/704
          - os: macos-14
            arch: "arm64"
            env:
              CMAKE_OSX_ARCHITECTURES: "arm64"
              MACOSX_DEPLOYMENT_TARGET: 14.0

          # Apple universal builds that contain x86-64 and arm64 binary code
          #   Needs extra treatment of all librarys that are not CMake
          #   controlled the dependencies:
          #   https://developer.apple.com/documentation/apple-silicon/building-a-universal-macos-binary
          # ADIOS1 tricky to build and HDF5 even with CMake as well (as of 1.12)
          # We could build them twice and use `lipo` to combine the lib artifacts.
          #- os: macos-15-intel
          #  arch: "universal2"
          #  env:
          #    CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"
          #    MACOSX_DEPLOYMENT_TARGET: 14.0

          # Pyodide / WebAssembly (wasm32-emscripten); published to PyPI under the
          # pyemscripten platform tag (PEP 783).
          #   https://cibuildwheel.pypa.io/en/stable/platforms/#pyodide
          # HDF5 + header-only JSON/TOML backends; ADIOS2 / MPI not built for WASM.
          - os: ubuntu-24.04
            arch: "wasm32"
            host_python: "3.12"   # cibuildwheel 4.x needs Python >= 3.11
            platform: "pyodide"
            build: "cp314-pyodide_wasm32"
            patches: ".github/setup-py-crosscompile-python.patch .github/cmakelists-hdf5-zlib-workaround.patch"

          # Pyodide 0.28.x (Python 3.13 / Emscripten 4.0.9): matches the currently
          # deployed JupyterLite / try-jupyter runtime, so this wheel installs there
          # today. cibuildwheel 4.1.0's default stable is 314, so building the older
          # (but still available) 0.28.3 requires the pyodide-eol enable.
          - os: ubuntu-24.04
            arch: "wasm32"
            host_python: "3.12"   # cibuildwheel 4.x needs Python >= 3.11
            platform: "pyodide"
            build: "cp313-pyodide_wasm32"
            pyodide_version: "0.28.3"
            cibw_enable: "pyodide-eol"
            patches: ".github/setup-py-crosscompile-python.patch .github/cmakelists-hdf5-zlib-workaround.patch"

    steps:
    - uses: actions/checkout@v4
      with:
        path: 'src'
        ref: ${{ env.SRC_REF }}

    - uses: actions/checkout@v4
      with:
        path: 'src/.github/'

    - uses: actions/setup-python@v5
      name: Install Python
      with:
        python-version: "${{ matrix.host_python || '3.11' }}"

    - name: Install cibuildwheel
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install cibuildwheel==4.1.0

    # Source patches not (yet) in the built release tag. Each is a standalone
    # openPMD-api dev-branch PR, except the wheels-only version bump (always
    # applied last). matrix.patches selects the per-platform set:
    #   native : setup-py-windows-cmake-options.patch (all-caps env on Windows)
    #   pyodide: setup-py-crosscompile-python.patch   (cross-compile FindPython)
    #            cmakelists-hdf5-zlib-workaround.patch (ZLIB::ZLIB for static HDF5)
    - name: Apply patches
      shell: bash
      run: |
        cd src
        for p in ${{ matrix.patches || '.github/setup-py-windows-cmake-options.patch' }} .github/setup-py-version-post1.patch; do
          git apply --ignore-whitespace "$p"
        done

    - name: Build wheel
      env:
        # platform + selection (native defaults: auto / all archs / all builds)
        CIBW_PLATFORM: "${{ matrix.platform || 'auto' }}"
        CIBW_ARCHS: "${{ matrix.arch }}"
        CIBW_BUILD: "${{ matrix.build || '*' }}"
        # Pyodide version is pinned per wasm matrix entry so we build for BOTH the
        # current deployed runtime (0.28.x / Em 4.0.9) and the future one (314 / Em 5.0.3).
        # Empty => cibuildwheel default (314.x); native legs leave both unset.
        # pyodide-eol enables building a Pyodide that is no longer cibw's default stable.
        CIBW_PYODIDE_VERSION: "${{ matrix.pyodide_version || '' }}"
        CIBW_ENABLE: "${{ matrix.cibw_enable || '' }}"
        CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
        # (1) Disable PyPy (manylinux image: yum repo issues)
        #     https://github.com/pypa/manylinux/issues/899
        CIBW_SKIP: "pp*-manylinux*"
        # Install dependencies (per platform). WASM cross-compiles HDF5+zlib in
        # BEFORE_BUILD (not BEFORE_ALL): the Emscripten toolchain is only on PATH
        # after the pyodide xbuildenv is set up, and the same emsdk/sysroot is
        # reused by the wheel build, so CMake's find_package finds the libs.
        CIBW_BEFORE_BUILD_LINUX: bash -x .github/library_builders.sh
        CIBW_BEFORE_BUILD_MACOS: bash -x .github/library_builders.sh
        CIBW_BEFORE_BUILD_PYODIDE: bash -x .github/library_builders.sh wasm
        CIBW_BEFORE_BUILD_WINDOWS: 'cmd /E:ON /V:ON /C .github\library_builders.bat'
        # openPMD-api build: search for static HDF5/ADIOS2/zlib (see setup.py).
        # Pyodide overrides with HDF5 + header-only JSON/TOML only (no ADIOS2/MPI);
        # its static HDF5/zlib live in the Emscripten sysroot and the patched
        # setup.py points FindPython at the cross sysconfig include dir.
        CIBW_ENVIRONMENT: >
          HDF5_USE_STATIC_LIBRARIES='ON'
          ZLIB_USE_STATIC_LIBS='ON'
          ADIOS_USE_STATIC_LIBS='ON'
          openPMD_CMAKE_openPMD_USE_HDF5='ON'
          openPMD_CMAKE_openPMD_USE_ADIOS2='ON'
        CIBW_ENVIRONMENT_PYODIDE: >
          openPMD_CMAKE_openPMD_USE_HDF5='ON'
          openPMD_CMAKE_openPMD_USE_ADIOS2='OFF'
          openPMD_USE_MPI='OFF'
          HDF5_USE_STATIC_LIBRARIES='ON'
          ZLIB_USE_STATIC_LIBS='ON'
        CIBW_ENVIRONMENT_WINDOWS: >
          HDF5_USE_STATIC_LIBRARIES='ON'
          ZLIB_USE_STATIC_LIBS='ON'
          openPMD_CMAKE_openPMD_USE_HDF5='ON'
          openPMD_CMAKE_openPMD_USE_ADIOS2='ON'
          CMAKE_PREFIX_PATH='C:/Program Files (x86)/ADIOS2;C:/Program Files (x86)/blosc2;C:/Program Files (x86)/HDF5;C:/Program Files (x86)/SQLite3;C:/Program Files (x86)/ZFP;C:/Program Files (x86)/zlib'
        # Fully static link => pyodide needs no wheel-repair step
        CIBW_REPAIR_WHEEL_COMMAND_PYODIDE: ""
        # C++17 on macOS: deployment target per arch (arm64 needs 11.0+)
        #   https://cibuildwheel.readthedocs.io/en/stable/cpp_standards/#macos-and-deployment-target-versions
        MACOSX_DEPLOYMENT_TARGET: "${{ matrix.env.MACOSX_DEPLOYMENT_TARGET }}"
        CMAKE_OSX_ARCHITECTURES: "${{ matrix.env.CMAKE_OSX_ARCHITECTURES }}"
        CMAKE_GENERATOR: "${{ matrix.env.CMAKE_GENERATOR }}"
        CMAKE_GENERATOR_PLATFORM: "${{ matrix.env.CMAKE_GENERATOR_PLATFORM }}"
        # Pre-import smoke test: dump the extension's (transitive) shared-library
        # dependencies + flag non-system/unbundled ones (check_wheel_libs.py),
        # then import and assert the backends. Non-fatal, the import test is the
        # actual success/failure test, and the print helps debugging it when needed.
        # Pyodide runs in a node sandbox -> best-effort `|| true`; native uses &&.
        CIBW_TEST_REQUIRES: numpy
        CIBW_TEST_REQUIRES_PYODIDE: numpy
        CIBW_TEST_COMMAND: >
          python {project}/.github/check_wheel_libs.py &&
          python -c "import openpmd_api as io; v = io.variants;
          assert v['hdf5'] and v['adios2'] and v['json'], v;
          print('openPMD', io.__version__, dict(v))"
        CIBW_TEST_COMMAND_PYODIDE: >
          python {project}/.github/check_wheel_libs.py || true;
          python -c "import openpmd_api as io; v = io.variants;
          assert v['hdf5'] and v['json'] and not v['adios2'], v;
          print('openPMD-WASM', io.__version__, dict(v))"
        # Show a bit more output (pip -v)
        CIBW_BUILD_VERBOSITY: 1
      run: |
        cd src
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install --upgrade cmake
        python -m cibuildwheel --output-dir ../wheelhouse

    - uses: actions/upload-artifact@v4
      name: Publish as GitHub artifact
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse
        overwrite: true

    - name: Publish on pypi.org
      if: github.event_name == 'push' && github.repository == 'openPMD/openPMD-api' && github.ref == 'refs/heads/wheels'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.pypa_gh_action_upload }}
      run: |
        python -m pip install -U twine
        python -m twine upload --skip-existing wheelhouse/*

  # Publish the source distribution (sdist) LAST, after every wheel matrix leg
  # has finished and streamed its wheels to PyPI. Otherwise the first wheel leg
  # to finish would race the sdist onto PyPI, and a user's `pip install` could
  # pick the sdist before a matching wheel exists -> a failing local source build.
  publish_sdist:
    name: Publish sdist (last)
    needs: [build_wheels]
    runs-on: ubuntu-22.04
    # needs: waits for ALL wheel matrix legs -> sdist is strictly last.
    # !cancelled() lets the universal-fallback sdist still ship if an exotic
    # wheel leg (wasm/i686) failed, so one flaky build can't suppress the
    # source fallback for everyone. Same push/branch/repo guard as the wheels.
    if: ${{ !cancelled() && github.event_name == 'push' && github.repository == 'openPMD/openPMD-api' && github.ref == 'refs/heads/wheels' }}
    steps:
    - uses: actions/checkout@v4
      with:
        path: 'src'
        ref: ${{ env.SRC_REF }}

    - uses: actions/checkout@v4
      with:
        path: 'src/.github/'

    - uses: actions/setup-python@v5
      name: Install Python
      with:
        python-version: "3.11"

    - name: Apply patches
      shell: bash
      run: |
        cd src
        for p in $SDIST_PATCHES; do
          git apply --ignore-whitespace "$p"
        done

    - name: Build sdist
      run: |
        cd src
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install --upgrade cmake
        python setup.py sdist --dist-dir ../wheelhouse

    - uses: actions/upload-artifact@v4
      name: Publish as GitHub artifact
      with:
        name: sdist
        path: ./wheelhouse
        overwrite: true

    - name: Publish on pypi.org
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.pypa_gh_action_upload }}
      run: |
        python -m pip install -U twine
        python -m twine upload --skip-existing wheelhouse/*
